<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Calendar Widget</title>
    <style>
        /* HIER KANNST DU DEINE FARBEN ANPASSEN */
        :root {
            --bg-color: #ffffff; /* Hintergrundfarbe */
            --text-color: #37352f; /* Textfarbe (Notion Standard) */
            --today-bg: #3A3838; /* Hintergrund für den heutigen Tag */
            --today-text: #ffffff; /* Textfarbe für den heutigen Tag */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .calendar {
            width: 100%;
            max-width: 350px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: #999;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 5px;
        }

        .day {
            padding: 10px 0;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .day.today {
            background-color: var(--today-bg);
            color: var(--today-text);
            font-weight: bold;
        }

        .day.empty {
            color: transparent;
        }
    </style>
</head>
<body>

    <div class="calendar">
        <div class="header" id="month-year"></div>
        <div class="weekdays">
            <div>MO</div><div>DI</div><div>MI</div><div>DO</div><div>FR</div><div>SA</div><div>SO</div>
        </div>
        <div class="days" id="days"></div>
    </div>

    <script>
        // Auch hier verpacken wir alles in eine Funktion
        function updateCalendar() {
            const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            const today = new Date();
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();
            const currentDate = today.getDate();

            // Monat und Jahr oben setzen
            document.getElementById('month-year').innerText = `${monthNames[currentMonth]} ${currentYear}`;

            const daysContainer = document.getElementById('days');
            
            // WICHTIG: Bevor wir aktualisieren, leeren wir die alten Tage aus dem Container!
            daysContainer.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Da JS den Sonntag als 0 sieht, wir aber den Montag als 1. Tag wollen
            let emptyDays = firstDay === 0 ? 6 : firstDay - 1;

            // Leere Tage vor dem 1. des Monats einfügen
            for (let i = 0; i < emptyDays; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.classList.add('day', 'empty');
                daysContainer.appendChild(emptyDiv);
            }

            // Tage des Monats einfügen
            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                dayDiv.innerText = i;
                
                // Prüfen, ob dieser Tag heute ist, um ihn farblich zu markieren
                if (i === currentDate) {
                    dayDiv.classList.add('today');
                }
                
                daysContainer.appendChild(dayDiv);
            }
        }

        // 1. Führe die Funktion beim ersten Laden der Seite aus
        updateCalendar();

        // 2. Aktualisiere den Kalender unsichtbar jede Minute (60.000 Millisekunden)
        setInterval(updateCalendar, 60000);
    </script>
</body>
</html>
